# Per-repo no-mistakes overrides for Crewhouse.

# The Test step's runtime proof is done-done: the repo's journeys drive the real
# crewd the same way a maintainer runs it by hand (there is no verify skill left;
# proof lines say "no verify skill - done-done journey <name>"). The repo's own
# gates stay required; these instructions add to them and never replace or
# weaken them.
test:
  instructions: |
    Required, in order, from the run worktree with dependencies installed (npm ci):
    1. npm run check (tsc, strict) and npm test (the isolated stub suite; CI parity).
    2. node scripts/floor-guard.mjs — the CONSTRAINTS.md floor on this diff. Exit 0
       required; exit 1 lists violations; exit 2 means the guard could not run and
       must be reported as such, never treated as clean.
    3. Runtime proof, for any change touching src/, web/src/, relay/, tools/ or the
       phone-facing contract: `done-done run stub-drive` (the real crewd on the
       stub engine, CREWHOUSE_ENGINE=stub, under the journey's own env mask and
       OS-assigned port, driven through the app's own API journey) and
       `done-done run static-checks` (the personal-voice copy check).
       These are baseline checks, never replacements for feature proof. Read
       docs/verification/README.md and run every recipe affected by the diff,
       including sibling actions and each changed web/PWA/native surface, using
       docs/verification/runbook.md for launch, authority and cleanup. Use the
       named .done-done.yaml primitives where provided; otherwise wrap the recipe's
       real driver in `done-done run -- <command>` with outputs written under
       $DONE_DONE_EVIDENCE_ROOT. A journey marked `spends:` (phone-chat-keep,
       phone-continue) is never started with `done-done run` (it refuses) or a
       wrapper: it needs `done-done verify <journey> --outcome "..."` and the
       person's spend approval, so without that approval it is NOT RUN.
       Report selected feature IDs and evidence per ID.
       For UI work capture EACH changed screen day/night at 390/1440, its
       interaction recording and the 360-wide largest-text look check, including
       installed/native proof where its recipe requires it. The `screens` smoke
       alone cannot satisfy a changed feature. Keep required real-engine, iPad,
       release-APK and authorization checks; unavailable prerequisites are NOT RUN,
       never a smoke substitution. Send asks, reports and evidence via sign-off-axi.
       Then `done-done check --outcome "<what a user can now do>" <evidence-files...>`
       and `done-done receipt --outcome "<same outcome>" <same-evidence-files...>`
       on a clean tree. A change with no runtime-facing surface says so and skips
       this step.
    Never sign in, spend, or touch the owner's real crewd install, home, keyring or
    ~/.pi; never run a second crewd on the default port 7711; evidence lives outside
    the worktree and survives cleanup; cleanup kills only processes this run started.
    Report anything not run as NOT RUN with the reason, and never present a
    stub-engine result as a real-model or real-sign-in result.
