name: Linux desktop release

# The downloads a person installs without a terminal: the .deb, and the desktop app (AppImage and .deb), attached to a GitHub release.
# Push a tag (linux-v<version>) and the asset lands there; nobody types a command to install it.
on:
  push:
    tags: ['linux-v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/prepare-engine.mjs "$RUNNER_TEMP/engine-prepare"
      - run: npm run build:web
      - run: node scripts/package.mjs
      # The software centre reads the version out of package.json; the tag's own suffix stays off the package version.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease dist/crewhouse_*_amd64.deb dist/crewhouse-*-linux-x64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  # The desktop app (desktop/): an AppImage and a .deb, attached to the same release. No signing on Linux.
  desktop:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix desktop
      - run: npm run build:web
      - run: node desktop/build.mjs
      - run: gh release upload "$GITHUB_REF_NAME" dist/desktop/Crewhouse-*-x86_64.AppImage dist/desktop/crewhouse-desktop_*_amd64.deb
        env:
          GH_TOKEN: ${{ github.token }}
