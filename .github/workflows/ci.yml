name: CI

on:
  pull_request:
  push:
    branches: [main]

# One group per pull request, so a second push to the same PR cancels the run it replaced instead of queueing
# behind it. Every other run (a push to main, a dispatch) gets a group of its own: it can never be cancelled and
# never cancels anything, because landing on main must not lose a gate to the next commit.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a change can affect: a pull request touching only docs (docs/, top-level *.md), evidence or the landing page
  # skips the heavy work below without taking a runner, and every required check name still reports, as skipped
  # (mobile/ and .agents/ stay in: kept tests read them).
  # The relay image builds only when the relay changed. A push to main always runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      relay: ${{ steps.diff.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo code=true >> "$GITHUB_OUTPUT"; echo relay=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          echo code=$(echo "$files" | grep -qvE '^(docs/|data/|landing/|[^/]+\.md$|LICENSE$|NOTICE$)' && echo true || echo false) >> "$GITHUB_OUTPUT"
          echo relay=$(echo "$files" | grep -qE '^(relay/|\.github/)' && echo true || echo false) >> "$GITHUB_OUTPUT"

  # The suite in three parallel parts: the gateway files are most of the wall time, so they get two of them.
  # They are three plain jobs, not matrix legs, because GitHub evaluates a job's `if` before it expands its
  # matrix: a skipped matrix job reports one unexpanded name, so the required `check (24, <group>)` names would
  # never report on a docs-only pull request and the PR could not merge. Plain jobs keep the exact required
  # names (`24` is the engine's supported line, OpenClaw 2026.9.33: Node 24.16+ or 26.1+) and skip whole at job
  # level, so a docs-only change reports them without holding a runner. The three share one steps list below, so
  # the parts stay identical: only the group they run differs.
  check-migrate:
    needs: changes
    name: check (24, migrate)
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROUP: migrate
      CREWHOUSE_ENGINE_DIR: ${{ github.workspace }}/runtime/openclaw
    steps: &check-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Private desktops, capture libraries and the sandboxed shell; cookie isolation must run, not skip.
      # Only Ubuntu supplies our packages; unrelated runner repositories must not delay the test budget.
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - run: sudo apt-get install -y -qq xvfb bubblewrap poppler-utils libpipewire-0.3-0t64 libxkbcommon0 libevdev2 libxcursor1 libx11-6 libwayland-client0 libstdc++6 && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The pinned engine install, keyed on the lockfile that pins the kit; prepare reuses a matching one.
      - uses: actions/cache@v4
        with:
          path: |
            runtime/openclaw
            runtime/openclaw.sets
          key: engine-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - run: node scripts/prepare-engine.mjs "$RUNNER_TEMP/engine-prepare"
      # Since kit 0.6.2 the engine installs as a verified read-only set; audit the installed set, not the engine dir.
      - run: npm audit signatures --prefix "$(cat "$RUNNER_TEMP/engine-prepare/openclaw/engine-set")"
      - run: npm run check
      - run: npm run build:web
      - run: npm test -- --group="$GROUP" # stub runner only: no Herdr, no CLI, no model calls
  check-engine:
    needs: changes
    name: check (24, engine)
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 15 -> 30: the gateway files' own wall times (about 10 minutes of tests) plus npm ci, engine prepare, check and
    # build:web ran the 15-minute budget out on PR 753 twice (GitHub reports the kill as cancelled, not failed).
    timeout-minutes: 30
    env:
      GROUP: engine
      CREWHOUSE_ENGINE_DIR: ${{ github.workspace }}/runtime/openclaw
    steps: *check-steps
  check-app:
    needs: changes
    name: check (24, app)
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROUP: app
      CREWHOUSE_ENGINE_DIR: ${{ github.workspace }}/runtime/openclaw
    steps: *check-steps

  done-done:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The merge gate calls done-done: fresh proof of this head from the repo's own
    # journeys (stub engine, no browser, no model), checked and receipted, then
    # re-verified. done-done-axi is pinned exactly like every other tool pin.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install -g --no-audit --no-fund done-done-axi@0.3.0
      - run: npm run build:web
      - run: done-done doctor
      - run: done-done run stub-drive
      - run: done-done run static-checks
      - run: |
          E="$HOME/.done-done/evidence/crewhouse"
          done-done receipt --outcome "stub-engine crewd answers the app journey and copy stays one-person" "$E"/*/api-transcript.jsonl "$E"/*/summary.json "$E"/*/personal-voice.log --claim-id ci
          done-done receipt --verify HEAD

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The one download, built and installed as a person would: apt brings bubblewrap and Xvfb, the menu entry's
    # launcher starts crewd from /opt/crewhouse with its own Node, and the app answers.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREWHOUSE_ENGINE_DIR: ${{ github.workspace }}/runtime/openclaw
      CREWHOUSE_PORT: '7711'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: |
            runtime/openclaw
            runtime/openclaw.sets
          key: engine-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - run: node scripts/prepare-engine.mjs "$RUNNER_TEMP/engine-prepare"
      - run: npm run build:web
      # Exercise the identical package/install journey, not release-grade compression (~11 minutes at xz -6).
      - run: node scripts/package.mjs
        env:
          XZ_OPT: '-T2 -1'
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - run: sudo apt-get install -y -qq ./dist/crewhouse_*_amd64.deb
      - run: |
          dpkg -s bubblewrap xvfb | grep -c 'Status: install ok installed' | grep -qx 2
      - run: |
          grep -q '^Exec=/opt/crewhouse/node/bin/node /opt/crewhouse/launch.mjs$' /usr/share/applications/crewhouse.desktop
      - run: |
          printf '%s\n' "CREWHOUSE_STATE_DIR=$RUNNER_TEMP/package-state" "CREWHOUSE_CREW_DIR=$RUNNER_TEMP/package-crew" \
            "CREWHOUSE_TOOLS_DIR=$RUNNER_TEMP/package-tools" >> "$GITHUB_ENV"
      - run: CREWHOUSE_ENGINE=stub CREWHOUSE_PACKAGED=0 CREWHOUSE_NO_SERVICE=1 crewhouse-app --no-open
      - run: |
          curl -fsS -H 'x-crewhouse: 1' -H "Authorization: Bearer $(cat "$CREWHOUSE_STATE_DIR/person.key")" http://127.0.0.1:7711/api/state | grep -q '"person"'
      - run: |
          curl -fsS http://127.0.0.1:7711/ | grep -qi '<html'
      # The one-line install, from the tarball this job just built, as a person types it: install, start, status, link,
      # doctor, stop, in a folder with no repo. Own ports and folders, so the .deb's Crewhouse above is left alone.
      - run: |
          export CREWHOUSE_ENGINE=stub CREWHOUSE_NO_SERVICE=1 CREWHOUSE_PORT=7721 CREWHOUSE_LINK_PORT=7722 \
            CREWHOUSE_STATE_DIR="$RUNNER_TEMP/cli-state" CREWHOUSE_CREW_DIR="$RUNNER_TEMP/cli-crew" CREWHOUSE_TOOLS_DIR="$RUNNER_TEMP/cli-tools"
          CREWHOUSE_TARBALL="$(ls "$PWD"/dist/crewhouse-*-linux-x64.tar.gz)" CREWHOUSE_INSTALL_DIR="$RUNNER_TEMP/cli-release" \
            CREWHOUSE_BIN_DIR="$RUNNER_TEMP/cli-bin" sh install.sh
          export PATH="$RUNNER_TEMP/cli-bin:$PATH"
          cd "$RUNNER_TEMP"
          if crewhouse status; then echo "status said running before start"; exit 1; fi
          crewhouse start | tee cli-start.txt
          grep -q 'Crewhouse is running at http://127.0.0.1:7721/' cli-start.txt
          crewhouse status | grep -q 'is running'
          # doctor exits 1 when anything it checks is missing (the runner has no PipeWire): here it must only run and report.
          crewhouse doctor | tee cli-doctor.txt
          grep -q 'Engine: ' cli-doctor.txt
          crewhouse link 2>&1 | grep -qE 'open this link|not listening for phones'
          crewhouse stop | grep -q 'Crewhouse stopped'
          if crewhouse status; then echo "status said running after stop"; exit 1; fi

  # Screens in CI: the mock slugs (screens-ci.tsv) on ?demo at 390 and 1440, day and night, as a workflow artifact only.
  # Changed frames are compared with main's latest screens artifact and listed as text in the job summary. Runs beside
  # the required checks and is not required: a red run here blocks no merge. Demo data only, no crewd, no model.
  screens:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install -g --no-audit --no-fund chrome-devtools-axi@0.1.34
      - run: npm run build:web
      - name: Baseline from main's latest screens artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=screens&per_page=50" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/baseline.zip"
            unzip -q "$RUNNER_TEMP/baseline.zip" -d "$RUNNER_TEMP/baseline"
          else
            echo "no screens artifact on main yet"
          fi
      - run: bash scripts/verify/ci-screens.sh "$RUNNER_TEMP/screens" "$RUNNER_TEMP/baseline"
      - if: always()
        run: |
          { echo '### Changed frames (text only; compared with main)'; echo '```'; cat "$RUNNER_TEMP/screens/changed-frames.txt" 2>/dev/null || echo 'no frames captured'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 30

  relay-image:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crewhouse-relay relay/
      - run: docker run -d --name relay -p 127.0.0.1:7300:7300 crewhouse-relay
      - run: for i in $(seq 30); do node relay/health.ts && exit 0; sleep 1; done; docker logs relay; exit 1
