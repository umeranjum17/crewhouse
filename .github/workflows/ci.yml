name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.18', '24'] # the engines floor and the current LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build:web
      - run: npm test # stub runner only: no Herdr, no CLI, no model calls

  package:
    # The one download, built and installed as a family would: apt brings bubblewrap and Xvfb, the menu entry's
    # launcher starts crewd from /opt/crewhouse with its own Node, and the app answers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: node scripts/package.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ./dist/crewhouse_*_amd64.deb
      - run: |
          dpkg -s bubblewrap xvfb | grep -c 'Status: install ok installed' | grep -qx 2
      - run: |
          grep -q '^Exec=/opt/crewhouse/node/bin/node /opt/crewhouse/launch.mjs$' /usr/share/applications/crewhouse.desktop
      - run: CREWHOUSE_ENGINE=stub CREWHOUSE_PACKAGED=0 CREWHOUSE_NO_SERVICE=1 crewhouse-app --no-open
      - run: |
          curl -fsS http://127.0.0.1:7711/api/state | grep -q '"person"'
      - run: |
          curl -fsS http://127.0.0.1:7711/ | grep -qi '<html'

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crewhouse-relay relay/
      - run: docker run -d --name relay -p 127.0.0.1:7300:7300 crewhouse-relay
      - run: for i in $(seq 30); do node relay/health.ts && exit 0; sleep 1; done; docker logs relay; exit 1
