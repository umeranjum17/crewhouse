name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.18', '24'] # the engines floor and the current LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build:web
      - run: npm test # stub runner only: no Herdr, no CLI, no model calls

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crewhouse-relay relay/
      - run: docker run -d --name relay -p 127.0.0.1:7300:7300 crewhouse-relay
      - run: for i in $(seq 30); do node relay/health.ts && exit 0; sleep 1; done; docker logs relay; exit 1
