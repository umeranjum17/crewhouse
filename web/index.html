<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7f2" />
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Crewhouse</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- The look before the first paint (useLook in main.tsx keeps it after): a night viewer's first frame is the night background, not the day one. -->
  <script>try { var q = new URLSearchParams(location.search), l = q.has('night') ? 'night' : q.has('day') ? 'day' : localStorage.getItem('crewhouse.look') || 'auto', h = new Date().getHours(); document.documentElement.dataset.theme = l === 'night' || (l === 'auto' && (h >= 19 || h < 7)) ? 'night' : 'day'; } catch (e) {}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
