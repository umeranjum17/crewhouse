plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.crewhouse'
version = '1.0.0'

android {
  namespace "expo.modules.crewhousenet"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ByokitAccessibility: the service hands itself to @byokit/overlay.
  implementation project(':byokit-overlay')
}
