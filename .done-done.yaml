# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "crewhouse"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Commits touching only these keep evidence fresh (mirrors CI's docs-only skip):
# a proof of HEAD still counts until a commit outside this list lands.
evidence:
  ignore_paths: ["docs/**", "data/**", "landing/**", "AGENTS.md", "CLAUDE.md", "CONSTRAINTS.md", "README.md", "TRY-IT.md", "VISION.md", "LICENSE", "NOTICE"]
journeys:
  # The core user journey: a person pairs the PWA to their own crew and gets a real Chief reply. The real engine
  # (OpenClaw through the BYOKit kit) on the account the key signs in, the repo's own relay, the built shell on a
  # public-style origin, one Chromium that pairs, says hello and reads the answer. The key is read from the
  # environment by name, never printed: OPENROUTER_API_KEY, the lead's own key, on the free MiniMax M3.1 Flash, so
  # the run spends model calls but no money (no spend gate: the run would park for an approval nobody gives).
  core:
    core: true
    timeout: 45m
    spends: 'a few live model calls on the free MiniMax M3.1 Flash, on the key the environment names (OPENROUTER_API_KEY)'
    command: 'CHAT_KEY_ENV=${CHAT_KEY_ENV:-OPENROUTER_API_KEY} timeout -k 10 2400 bash scripts/verify/pair-chat.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The release path: the previous shipped version (the app ships as an npm package with a bin), installed and
  # then upgraded over in place, and the core journey driven on the upgraded app.
  upgrade:
    upgrade: true
    timeout: 60m
    command: 'CHAT_KEY_ENV=${CHAT_KEY_ENV:-OPENROUTER_API_KEY} timeout -k 10 3000 bash scripts/verify/upgrade.sh "$DONE_DONE_EVIDENCE_ROOT"'
  stub-drive:
    command: "node scripts/verify/stub-drive.mjs --out $DONE_DONE_EVIDENCE_ROOT"
  static-checks:
    command: "node scripts/verify/personal-voice.mjs --self-test > $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1 && node scripts/verify/personal-voice.mjs >> $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1"
  screens:
    command: 'scripts/verify/screens-smoke.sh "$DONE_DONE_EVIDENCE_ROOT"'
  delivered-files:
    command: 'timeout -k 10 600 bash scripts/verify/files-gate.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  workbook-chart:
    command: 'PWA=1 timeout -k 10 600 bash scripts/verify/workbook-chart.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  slides-deck:
    command: 'timeout -k 10 600 bash scripts/verify/slides-deck.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  unlock-card:
    command: 'timeout -k 10 600 bash scripts/verify/unlock-card.sh "$DONE_DONE_EVIDENCE_ROOT"'
  event-routines:
    command: 'PWA=1 timeout -k 10 900 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/event-routines.mjs "$DONE_DONE_EVIDENCE_ROOT" && timeout -k 10 300 node scripts/test.mjs test/event-routines.test.ts > "$DONE_DONE_EVIDENCE_ROOT/event-routines-test.log" 2>&1'
  chief-soul:
    command: 'timeout -k 10 600 bash scripts/verify/chief-soul.sh "$DONE_DONE_EVIDENCE_ROOT"'
  ask-in-view:
    command: 'timeout -k 10 600 bash scripts/verify/ask-in-view.sh "$DONE_DONE_EVIDENCE_ROOT"'
  signin-card:
    command: 'timeout -k 10 300 node scripts/verify/signin-card.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state/person.key" "$DONE_DONE_EVIDENCE_ROOT"'
  cli-cause:
    command: 'timeout -k 10 300 bash scripts/verify/cli-cause.sh "$DONE_DONE_EVIDENCE_ROOT"'
  site-signin:
    command: 'timeout -k 10 600 node scripts/verify/site-signin.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state" "$DONE_DONE_EVIDENCE_ROOT" "${BOT:?helper id}"'
  pwa-pair:
    command: 'timeout -k 10 600 bash scripts/verify/pwa-pair.sh "$DONE_DONE_EVIDENCE_ROOT"'
  pwa-plan:
    command: 'timeout -k 10 600 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/pwa-shell.mjs "${PLAN:?recipe plan with outputs under DONE_DONE_EVIDENCE_ROOT}" > "$DONE_DONE_EVIDENCE_ROOT/run.json"'
  chat-real:
    spends: 'a few live model calls on the MiniMax key file named by KEY_FILE'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chat-real.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  phone-pair:
    command: 'timeout -k 10 600 node scripts/verify/phone-pair.mjs --out "$DONE_DONE_EVIDENCE_ROOT" --state "${LAB:?owned lab}/state" --serial "${SERIAL:?owned emulator}" --base "${B:?owned daemon URL}" --apk "${APK:?release apk}" --record'
  phone-chat-keep:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-chat-keep.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}" --offline --interrupted --seed-turns 52'
  phone-continue:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-continue.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}"'
