# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "crewhouse"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Commits touching only these keep evidence fresh (mirrors CI's docs-only skip):
# a proof of HEAD still counts until a commit outside this list lands.
evidence:
  ignore_paths: [ "docs/**", "data/**", "landing/**", "AGENTS.md", "CLAUDE.md", "CONSTRAINTS.md", "README.md", "TRY-IT.md", "VISION.md", "LICENSE", "NOTICE" ]
journeys:
  # The core user journey: a person pairs the PWA to their own crew and gets a real Chief reply. The real engine
  # (OpenClaw through the BYOKit kit) on the account the key signs in, the repo's own relay, the built shell on a
  # public-style origin, one Chromium that pairs, says hello and reads the answer. The key comes by path (the
  # person's own key file, the repo's usual place) and is read into the sign-in request and nowhere else, never
  # printed, logged, copied or kept, and never taken from an environment variable. The model is the free MiniMax
  # M3.1 Flash, so a run spends model calls but no money. The spend gate stays: the person answers it.
  core:
    core: true
    timeout: 45m
    spends: 'a few live model calls on the free MiniMax M3.1 Flash, on the key the key file names'
    command: 'bash scripts/verify/pair-chat.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The release path: the previous shipped version (the app ships as an npm package with a bin), installed and
  # then upgraded over in place, and the core journey driven on the upgraded app.
  upgrade:
    upgrade: true
    timeout: 60m
    command: 'bash scripts/verify/upgrade.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The phone-app download card on Settings › Phones: the forge's newest phone preview's arm64 asset, and the one
  # stable link while the forge cannot be asked, at 390/1440 in both themes, with the browser's own request records
  # (docs/verification/phone-download.md). Reads the forge's public API, needs no account, and publishes nothing.
  phone-download:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/phone-download.sh "$DONE_DONE_EVIDENCE_ROOT"'
  onboard-chat:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" NODE_BIN=/usr/bin/node timeout -k 10 600 bash scripts/verify/onboard-chat.sh "$DONE_DONE_EVIDENCE_ROOT"'
  desktop-first-launch:
    command: 'timeout -k 10 900 node scripts/verify/desktop-first-launch.mjs --out "$DONE_DONE_EVIDENCE_ROOT"'
  # The phone's cloud screen on the kit's fake boat.dev: the caller's emulator and flagged lab APK (where-cloud.md).
  cloud-screen:
    command: 'SERIAL="${SERIAL:?the emulator serial}" CLOUD_OTHER="${CLOUD_OTHER:?a folder for the states besides the claimed one}" timeout -k 10 900 bash scripts/verify/cloud-screen.sh "$DONE_DONE_EVIDENCE_ROOT" "${CLOUD_APK:?the flagged lab APK}"'
  # The phone's Home row naming the AI account signed in on the computer: the caller's emulator and lab APK (phone-accounts.md).
  phone-accounts:
    command: 'SERIAL="${SERIAL:?the emulator serial}" ACCOUNTS_OTHER="${ACCOUNTS_OTHER:?a folder for the MiniMax-signed-in state}" timeout -k 10 900 bash scripts/verify/phone-accounts.sh "$DONE_DONE_EVIDENCE_ROOT" "${ACCOUNTS_APK:?the lab APK}"'
  # Chief on this phone with a MiniMax key: the caller's emulator and lab release APK, a lab key, a fake live model list, no model call (phone-only-minimax.md).
  phone-only-minimax:
    command: 'SERIAL="${SERIAL:?the emulator serial}" PHONE_OTHER="${PHONE_OTHER:?a folder for the states besides the claimed one}" timeout -k 10 600 bash scripts/verify/phone-only-minimax.sh "$DONE_DONE_EVIDENCE_ROOT" "${PHONE_APK:?the lab release APK}"'
  inbox-triage:
    command: 'PWA=1 timeout -k 3 360 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/inbox-triage.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Which Crewhouse runs: the CLI, Settings' foot on web and installed app, and with SERIAL and APK the phone (versions.md).
  versions:
    timeout: 25m
    command: 'PATH="/usr/bin:$PATH" timeout -k 10 1440 bash scripts/verify/versions.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # A chat order to Chief sets one member's account and model (docs/verification/member-models.md).
  member-models:
    command: 'node scripts/verify/member-models.mjs --out "$DONE_DONE_EVIDENCE_ROOT"'
  # The same order as chat frames in Chief's thread, dark and light at 1280 and 390 (docs/verification/member-models.md).
  member-models-screens:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/member-models-screens.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The same map on the screens: Settings › AI accounts and a member's page, edited in place (docs/verification/member-models.md).
  member-models-ui:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/member-models-ui.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Umer's job search from goal card to applied: the board, a role, the draft with the empty only-you fields (docs/verification/jobs-loop.md).
  jobs-loop:
    command: 'timeout -k 10 600 bash scripts/verify/jobs-loop.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Interview prep: the brief with linked sources, the likely questions and the practice chat (docs/verification/jobs-prep.md).
  jobs-prep:
    command: 'timeout -k 10 600 bash scripts/verify/jobs-prep.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The reusable long-goal parts: a flat to rent beside the job search, with its own stage names, the quiet daily search, and reminders (docs/verification/goal-parts.md).
  goal-parts:
    timeout: 20m
    command: 'timeout -k 10 1100 bash scripts/verify/goal-parts.sh "$DONE_DONE_EVIDENCE_ROOT"'
  stub-drive:
    command: "node scripts/verify/stub-drive.mjs --out $DONE_DONE_EVIDENCE_ROOT"
  static-checks:
    command: 'node scripts/verify/personal-voice.mjs --self-test > $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1 && node scripts/verify/personal-voice.mjs >> $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1 && node scripts/verify/steps.mjs "$DONE_DONE_EVIDENCE_ROOT" personal-voice'
  screens:
    command: 'scripts/verify/screens-smoke.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Chief's profile (J09c), How Chief works (J09d), Settings (J09a), one-line hire names, Your things (J07a) and a file
  # opened from it (J07b), face motion and the installed app, beside the approved mocks when EVIDENCE_HOME holds them
  # (docs/verification/settings-hub.md, things.md).
  stack-design:
    timeout: 20m
    command: 'PATH="/usr/bin:$PATH" timeout -k 10 1100 bash scripts/verify/stack-design.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Chief's profile from his hero (mock profile-b on the final Stack): no computer (its empty state), then Chief's own
  # live with Take control, You have control and Hand it back, at 390 and 1440, day and night, and in the installed
  # app (docs/verification/chief-profile.md).
  chief-profile:
    timeout: 15m
    command: 'PATH="/usr/bin:$PATH" timeout -k 10 850 bash scripts/verify/chief-profile.sh "$DONE_DONE_EVIDENCE_ROOT"'
  delivered-files:
    command: 'timeout -k 10 600 bash scripts/verify/files-gate.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  workbook-chart:
    command: 'PWA=1 timeout -k 10 600 bash scripts/verify/workbook-chart.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  slides-deck:
    command: 'timeout -k 10 600 bash scripts/verify/slides-deck.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  video-job:
    command: 'timeout -k 10 900 bash scripts/verify/video-job.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  phone-mic-fallback:
    command: 'FM_MEM_GATE=~/firstmate/config/fm-mem-gate.sh timeout -k 10 1800 bash scripts/verify/phone-mic-fallback.sh "$DONE_DONE_EVIDENCE_ROOT"'
  voice:
    command: 'timeout -k 10 600 bash scripts/verify/voice.sh "$DONE_DONE_EVIDENCE_ROOT"'
  image:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/image.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  unlock-card:
    command: 'timeout -k 10 600 bash scripts/verify/unlock-card.sh "$DONE_DONE_EVIDENCE_ROOT"'
  event-routines:
    command: 'PWA=1 timeout -k 10 900 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/event-routines.mjs "$DONE_DONE_EVIDENCE_ROOT" && timeout -k 10 300 node scripts/test.mjs test/event-routines.test.ts > "$DONE_DONE_EVIDENCE_ROOT/event-routines-test.log" 2>&1'
  custom-rules:
    command: 'timeout -k 10 600 xvfb-run -a -s "-screen 0 1920x1200x24" bash scripts/verify/custom-rules.sh "$DONE_DONE_EVIDENCE_ROOT"'
  chief-soul:
    command: 'timeout -k 10 600 bash scripts/verify/chief-soul.sh "$DONE_DONE_EVIDENCE_ROOT"'
  ask-in-view:
    command: 'timeout -k 10 600 bash scripts/verify/ask-in-view.sh "$DONE_DONE_EVIDENCE_ROOT"'
  signin-card:
    command: 'timeout -k 10 300 node scripts/verify/signin-card.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state/person.key" "$DONE_DONE_EVIDENCE_ROOT"'
  cli-cause:
    command: 'timeout -k 10 300 bash scripts/verify/cli-cause.sh "$DONE_DONE_EVIDENCE_ROOT"'
  site-signin:
    command: 'timeout -k 10 600 node scripts/verify/site-signin.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state" "$DONE_DONE_EVIDENCE_ROOT" "${BOT:?helper id}"'
  pwa-pair:
    command: 'timeout -k 10 600 bash scripts/verify/pwa-pair.sh "$DONE_DONE_EVIDENCE_ROOT"'
  pwa-plan:
    command: 'timeout -k 10 600 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/pwa-shell.mjs "${PLAN:?recipe plan with outputs under DONE_DONE_EVIDENCE_ROOT}" --out "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/run.json"'
  key-sheet:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/key-sheet.sh "$DONE_DONE_EVIDENCE_ROOT"'
  first-run-linux:
    timeout: 25m
    spends: 'one live model turn on the MiniMax key file named by KEY_FILE, for the first real answer'
    command: 'timeout -k 10 1500 bash scripts/verify/first-run-linux.sh "$DONE_DONE_EVIDENCE_ROOT" "${CREWHOUSE_DEB:?the released .deb to install}" "${KEY_FILE:?authorized MiniMax key file}"'
  home-list-preview:
    command: 'timeout -k 10 600 bash scripts/verify/home-list-preview.sh "$DONE_DONE_EVIDENCE_ROOT"'
  quiet-nudge:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/quiet-nudge.sh "$DONE_DONE_EVIDENCE_ROOT"'
  answer-check:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/answer-check.sh "$DONE_DONE_EVIDENCE_ROOT"'
  quiet-nudge-pwa:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/quiet-nudge-pwa.sh "$DONE_DONE_EVIDENCE_ROOT"'
  chat-real:
    spends: 'a few live model calls on the MiniMax key file named by KEY_FILE'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chat-real.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  chat-asks:
    timeout: 40m
    spends: 'a few live model calls on the free MiniMax M3.1 Flash, on the key file named by KEY_FILE'
    command: 'CHAT_ASKS=1 CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 2400 bash scripts/verify/chat-real.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  connect-apps:
    timeout: 60m
    spends: 'a few live model calls on the MiniMax key file named in ~/.config/crewhouse/connect-apps.conf, and one real read through the person''s own Composio sign-in'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:-connect-apps}" timeout -k 10 3000 bash scripts/verify/connect-apps.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Chief answers on the checkout's pinned engine with a scripted model: no account, no spend (the proof after a pin bump).
  chief-reply-engine:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chief-reply-engine.sh "$DONE_DONE_EVIDENCE_ROOT"'
  crew-room:
    spends: 'a few live model calls on the MiniMax key file named by KEY_FILE, or on OPENROUTER_API_KEY with CREW_ACCOUNT=openrouter'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/crew-room.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:-}"'
  flash-read:
    spends: 'a few live model calls on the OpenRouter key named by OPENROUTER_API_KEY'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/flash-read.sh "$DONE_DONE_EVIDENCE_ROOT"'
  chief-wait:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chief-wait.sh "$DONE_DONE_EVIDENCE_ROOT"'
  handoff-lane-reset:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" CREWHOUSE_ENGINE_DIR="$PWD/runtime/openclaw" timeout -k 10 900 bash scripts/verify/handoff-lane-reset.sh "$DONE_DONE_EVIDENCE_ROOT"'
  phone-live-control:
    spends: 'a few live model calls on the key named by KEY_FILE (a path, or env:NAME)'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 1500 bash scripts/verify/phone-live-control.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized key file}"'
  phone-web-pair:
    spends: 'a few live model calls on the key file named by KEY_FILE (MiniMax, or OpenRouter with AI=openrouter)'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/phone-web-pair.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  phone-pair:
    command: 'timeout -k 10 600 node scripts/verify/phone-pair.mjs --out "$DONE_DONE_EVIDENCE_ROOT" --state "${LAB:?owned lab}/state" --serial "${SERIAL:?owned emulator}" --base "${B:?owned daemon URL}" --apk "${APK:?release apk}" --record'
  phone-pair-link:
    command: 'LAB="${LAB:?owned lab}" timeout -k 10 900 node scripts/verify/phone-pair-link.mjs --out "$DONE_DONE_EVIDENCE_ROOT" --serial "${SERIAL:?owned emulator}" --apk "${APK:?release apk}"'
  phone-chat-keep:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-chat-keep.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}" --offline --interrupted --seed-turns 52'
  phone-continue:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-continue.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}"'
  binary-inspect:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/binary-inspect.sh "$DONE_DONE_EVIDENCE_ROOT"'
  skill-eval:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/skill-eval.sh "$DONE_DONE_EVIDENCE_ROOT"'
