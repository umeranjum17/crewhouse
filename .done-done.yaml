# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "crewhouse"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Commits touching only these keep evidence fresh (mirrors CI's docs-only skip):
# a proof of HEAD still counts until a commit outside this list lands.
evidence:
  ignore_paths: [ "docs/**", "data/**", "landing/**", "AGENTS.md", "CLAUDE.md", "CONSTRAINTS.md", "README.md", "TRY-IT.md", "VISION.md", "LICENSE", "NOTICE" ]
journeys:
  # The core user journey: a person pairs the PWA to their own crew and gets a real Chief reply. The real engine
  # (OpenClaw through the BYOKit kit) on the account the key signs in, the repo's own relay, the built shell on a
  # public-style origin, one Chromium that pairs, says hello and reads the answer. The key comes by path (the
  # person's own key file, the repo's usual place) and is read into the sign-in request and nowhere else, never
  # printed, logged, copied or kept, and never taken from an environment variable. The model is the free MiniMax
  # M3.1 Flash, so a run spends model calls but no money. The spend gate stays: the person answers it.
  core:
    core: true
    timeout: 45m
    spends: 'a few live model calls on the free MiniMax M3.1 Flash, on the key the key file names'
    command: 'bash scripts/verify/pair-chat.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The release path: the previous shipped version (the app ships as an npm package with a bin), installed and
  # then upgraded over in place, and the core journey driven on the upgraded app.
  upgrade:
    upgrade: true
    timeout: 60m
    command: 'bash scripts/verify/upgrade.sh "$DONE_DONE_EVIDENCE_ROOT"'
  onboard-chat:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" NODE_BIN=/usr/bin/node timeout -k 10 600 bash scripts/verify/onboard-chat.sh "$DONE_DONE_EVIDENCE_ROOT"'
  stub-drive:
    command: "node scripts/verify/stub-drive.mjs --out $DONE_DONE_EVIDENCE_ROOT"
  static-checks:
    command: 'node scripts/verify/personal-voice.mjs --self-test > $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1 && node scripts/verify/personal-voice.mjs >> $DONE_DONE_EVIDENCE_ROOT/personal-voice.log 2>&1 && node scripts/verify/steps.mjs "$DONE_DONE_EVIDENCE_ROOT" personal-voice'
  screens:
    command: 'scripts/verify/screens-smoke.sh "$DONE_DONE_EVIDENCE_ROOT"'
  delivered-files:
    command: 'timeout -k 10 600 bash scripts/verify/files-gate.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  workbook-chart:
    command: 'PWA=1 timeout -k 10 600 bash scripts/verify/workbook-chart.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  slides-deck:
    command: 'timeout -k 10 600 bash scripts/verify/slides-deck.sh "$PWD" "$DONE_DONE_EVIDENCE_ROOT"'
  unlock-card:
    command: 'timeout -k 10 600 bash scripts/verify/unlock-card.sh "$DONE_DONE_EVIDENCE_ROOT"'
  event-routines:
    command: 'PWA=1 timeout -k 10 900 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/event-routines.mjs "$DONE_DONE_EVIDENCE_ROOT" && timeout -k 10 300 node scripts/test.mjs test/event-routines.test.ts > "$DONE_DONE_EVIDENCE_ROOT/event-routines-test.log" 2>&1'
  chief-soul:
    command: 'timeout -k 10 600 bash scripts/verify/chief-soul.sh "$DONE_DONE_EVIDENCE_ROOT"'
  ask-in-view:
    command: 'timeout -k 10 600 bash scripts/verify/ask-in-view.sh "$DONE_DONE_EVIDENCE_ROOT"'
  signin-card:
    command: 'timeout -k 10 300 node scripts/verify/signin-card.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state/person.key" "$DONE_DONE_EVIDENCE_ROOT"'
  cli-cause:
    command: 'timeout -k 10 300 bash scripts/verify/cli-cause.sh "$DONE_DONE_EVIDENCE_ROOT"'
  site-signin:
    command: 'timeout -k 10 600 node scripts/verify/site-signin.ts "$PWD" "${B:?owned daemon URL}" "${LAB:?owned lab}/state" "$DONE_DONE_EVIDENCE_ROOT" "${BOT:?helper id}"'
  pwa-pair:
    command: 'timeout -k 10 600 bash scripts/verify/pwa-pair.sh "$DONE_DONE_EVIDENCE_ROOT"'
  pwa-plan:
    command: 'timeout -k 10 600 xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/verify/pwa-shell.mjs "${PLAN:?recipe plan with outputs under DONE_DONE_EVIDENCE_ROOT}" --out "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/run.json"'
  key-sheet:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/key-sheet.sh "$DONE_DONE_EVIDENCE_ROOT"'
  quiet-nudge:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/quiet-nudge.sh "$DONE_DONE_EVIDENCE_ROOT"'
  quiet-nudge-pwa:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/quiet-nudge-pwa.sh "$DONE_DONE_EVIDENCE_ROOT"'
  chat-real:
    spends: 'a few live model calls on the MiniMax key file named by KEY_FILE'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chat-real.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  connect-apps:
    timeout: 60m
    spends: 'a few live model calls on the MiniMax key file named in ~/.config/crewhouse/connect-apps.conf, and one real read through the person''s own Composio sign-in'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 3000 bash scripts/verify/connect-apps.sh "$DONE_DONE_EVIDENCE_ROOT"'
  crew-room:
    spends: 'a few live model calls on the MiniMax key file named by KEY_FILE, or on OPENROUTER_API_KEY with CREW_ACCOUNT=openrouter'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/crew-room.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:-}"'
  flash-read:
    spends: 'a few live model calls on the OpenRouter key named by OPENROUTER_API_KEY'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/flash-read.sh "$DONE_DONE_EVIDENCE_ROOT"'
  chief-wait:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/chief-wait.sh "$DONE_DONE_EVIDENCE_ROOT"'
  phone-live-control:
    spends: 'a few live model calls on the key named by KEY_FILE (a path, or env:NAME)'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 1500 bash scripts/verify/phone-live-control.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized key file}"'
  phone-web-pair:
    spends: 'a few live model calls on the key file named by KEY_FILE (MiniMax, or OpenRouter with AI=openrouter)'
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 900 bash scripts/verify/phone-web-pair.sh "$DONE_DONE_EVIDENCE_ROOT" "${KEY_FILE:?authorized MiniMax key file}"'
  phone-pair:
    command: 'timeout -k 10 600 node scripts/verify/phone-pair.mjs --out "$DONE_DONE_EVIDENCE_ROOT" --state "${LAB:?owned lab}/state" --serial "${SERIAL:?owned emulator}" --base "${B:?owned daemon URL}" --apk "${APK:?release apk}" --record'
  phone-chat-keep:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-chat-keep.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}" --offline --interrupted --seed-turns 52'
  phone-continue:
    spends: 'live phone-only model calls on an explicitly authorized test account'
    command: 'timeout -k 10 600 node scripts/verify/phone-continue.mjs --serial "${SERIAL:?owned emulator}" --ev "$DONE_DONE_EVIDENCE_ROOT" --apk "${APK:?release apk}" --key-file "${KEY_FILE:?authorized test key file}"'
  skill-eval:
    command: 'CHROME_DEVTOOLS_AXI_SESSION="${CHROME_DEVTOOLS_AXI_SESSION:?task-named session}" timeout -k 10 600 bash scripts/verify/skill-eval.sh "$DONE_DONE_EVIDENCE_ROOT"'
